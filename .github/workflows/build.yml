name: Build

# Builds the game on every push / pull request, on Windows (MSYS2, the same
# toolchain the README tells players to install) and on Linux.
#
# Releases: when main is pushed and the version in the VERSION file has no
# release yet, a GitHub Release "v<VERSION>" is created (tag included) with a
# ready-to-play Windows zip. Pushing a tag like v1.2.0 works too.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-freeglut

      - name: Build with make
        run: |
          rm -f game.exe
          make CXXFLAGS="-O2 -Wall -Wextra -std=c++11"

      - name: Check game.exe only needs libfreeglut.dll
        run: |
          objdump -p game.exe | grep "DLL Name"
          if objdump -p game.exe | grep -qiE "libwinpthread|libstdc\+\+|libgcc_s"; then
            echo "::error::game.exe depends on a MinGW runtime DLL that is not shipped"
            exit 1
          fi

      - name: Build with build.bat
        run: |
          rm -f game.exe
          cmd //c build.bat
          test -f game.exe

      - name: Package
        run: |
          mkdir -p dist/VectorStorm
          cp game.exe /ucrt64/bin/libfreeglut.dll README.md LICENSE dist/VectorStorm/
          cd dist && zip -r VectorStorm-windows.zip VectorStorm

      - uses: actions/upload-artifact@v5
        with:
          name: VectorStorm-windows
          path: dist/VectorStorm-windows.zip

  linux:
    name: Linux (make + CMake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install FreeGLUT
        run: sudo apt-get update && sudo apt-get install -y freeglut3-dev

      - name: Build with make
        run: make CXXFLAGS="-O2 -Wall -Wextra -std=c++11"

      - name: Build with CMake
        run: |
          cmake -B build
          cmake --build build

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Decide the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(tr -d '[:space:]' < VERSION)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v5
        if: steps.ver.outputs.publish == 'true'
        with:
          name: VectorStorm-windows

      - name: Name the zip after the version
        if: steps.ver.outputs.publish == 'true'
        run: mv VectorStorm-windows.zip "VectorStorm-${{ steps.ver.outputs.tag }}-windows.zip"

      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VECTOR STORM ${{ steps.ver.outputs.tag }}
          files: VectorStorm-${{ steps.ver.outputs.tag }}-windows.zip
          body: |
            **Play on Windows:** download the zip below, extract it, and double-click `game.exe`
            (keep `libfreeglut.dll` in the same folder). Nothing else needs to be installed.

            Built automatically with MSYS2 UCRT64 from commit ${{ github.sha }}.
            To build it yourself or play on Linux, see the README.
